[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamepulse-bot"
version = "1.0.0"
description = "GamePulse - Production Telegram Gaming Bot with mini-games, achievements, and leaderboards"
readme = "README.md"
authors = [
    {name = "GamePulse Team", email = "support@gamepulsebot.com"}
]
license = {text = "MIT"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Communications :: Chat",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Framework :: Pytest",
]
keywords = ["telegram", "bot", "gaming", "game", "leaderboard", "achievements", "aiogram"]

dependencies = [
    # Core
    "python-dotenv==1.0.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    
    # Telegram Bot
    "aiogram==3.2.0",
    
    # Database
    "sqlalchemy==2.0.23",
    "asyncpg==0.29.0",
    "alembic==1.12.1",
    "psycopg2-binary==2.9.9",
    
    # Redis
    "redis==5.0.1",
    
    # API
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    
    # Utilities
    "python-multipart==0.0.6",
    "email-validator==2.1.0",
    "python-json-logger==2.0.7",
    "pytz==2023.3",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "httpx==0.25.1",
    "black==23.11.0",
    "flake8==6.1.0",
    "mypy==1.7.0",
    "isort==5.12.0",
    "pytest-watch==4.2.0",
    "pre-commit==3.5.0",
]
production = [
    "gunicorn==21.2.0",
]
docs = [
    "sphinx==7.2.6",
    "sphinx-rtd-theme==2.0.0",
]
all = [
    "gamepulse-bot[dev,production,docs]",
]

[project.urls]
Homepage = "https://github.com/yourusername/gamepulse-bot"
Repository = "https://github.com/yourusername/gamepulse-bot"
Documentation = "https://gamepulse-bot.readthedocs.io"
Issues = "https://github.com/yourusername/gamepulse-bot/issues"

[project.scripts]
gamepulse = "src.main:main"

[tool.setuptools]
packages = ["src"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.txt"]

# Black Configuration
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

# isort Configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["src"]
known_third_party = ["aiogram", "sqlalchemy", "fastapi", "pytest", "uvicorn"]

# mypy Configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_no_return = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
strict_optional = true
check_untyped_defs = true
show_error_codes = true
allow_redefinition = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "src.migrations.*",
    "tests.*",
]
ignore_errors = true

# Pytest Configuration
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "asyncio: Async tests",
]

# Coverage Configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
    "pass",
]
ignore_errors = true
show_missing = true

# Pydantic Configuration
[tool.pydantic]
version = 2.0

# Ruff Configuration (if using Ruff instead of Flake8)
[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise without from inside except
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["S101"]

# Bandit Configuration (security scanning)
[tool.bandit]
exclude_dirs = ["tests", "docs", "migrations"]
skips = ["B101", "B311"]
